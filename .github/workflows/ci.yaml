name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  vendor-check:
    name: Vendor Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      s3:
        image: ghcr.io/espebra/stupid-simple-s3:2.4.2
        ports:
          - 5553:5553
        env:
          STUPID_RW_ACCESS_KEY: pastebin-test
          STUPID_RW_SECRET_KEY: pastebin-test-secret
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Wait for Stupid Simple S3
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:5553/ && exit 0
            sleep 1
          done
          echo "Stupid Simple S3 did not start" >&2
          exit 1

      - name: Run integration tests
        env:
          PASTEBIN_TEST_S3_ENDPOINT: 127.0.0.1:5553
          PASTEBIN_TEST_S3_ACCESS_KEY: pastebin-test
          PASTEBIN_TEST_S3_SECRET_KEY: pastebin-test-secret
        run: go test -v -race -count=1 -tags integration ./internal/integration

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run fuzz tests
        run: |
          go test -fuzz=FuzzIsValidChecksum -fuzztime=30s ./internal/handlers
          go test -fuzz=FuzzComputeChecksum -fuzztime=30s ./internal/paste
          go test -fuzz=FuzzNewPaste -fuzztime=30s ./internal/paste
          go test -fuzz=FuzzTokenComparison -fuzztime=30s ./internal/csrf

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [vendor-check, lint, vulncheck, test, integration, fuzz]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/pastebin-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/pastebin

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pastebin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/pastebin-${{ matrix.goos }}-${{ matrix.goarch }}
