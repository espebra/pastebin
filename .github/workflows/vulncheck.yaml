# The vulncheck job in ci.yaml gates pushes and pull requests. This workflow
# runs the same check on a schedule, because the advisories that matter most
# here are Go standard library ones: they are published against a toolchain
# version this repository already pins, so nothing in the code has to change
# for the check to start failing, and without a cron nobody finds out until
# the next push.
name: Scheduled Vulnerability Check

on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
